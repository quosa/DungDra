[project]
name = "dungdra"
version = "0.1.0"
description = "A rules-faithful single-player fifth-edition-compatible (SRD 5.2.1) game engine"
requires-python = ">=3.10"

[project.optional-dependencies]
# SRD extraction for the rule-audit loop (per-character fontname/size for heading detection).
srd = ["pdfplumber>=0.11"]
# The loop overview page (docs/srd-loop-overview.pdf, built by scripts/docs/loop_overview.py).
docs = ["reportlab>=4"]
# Tests and the quality gates the dev loop enforces (see docs/srd-rule-loop-plan.md).
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "hypothesis>=6",
  "ruff>=0.14",
  "import-linter>=2",
  "pylint>=3",       # used only for duplicate-code (R0801)
  "vulture>=2.11",
  "mutmut>=3",
  "reportlab>=4",    # tests build the loop overview page
]

[project.scripts]
dungdra = "dungdra.cli:main"

[tool.setuptools.packages.find]
include = ["dungdra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "srd(unit_id, clause=None, kind=None, ruling=None): SRD-derived rule test (kind: positive|negative|boundary|abuse)",
]

[tool.coverage.run]
source = ["dungdra"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs/loop-example"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF100"]

[tool.ruff.lint.mccabe]
# Starts at today's worst function; the dev loop ratchets it down to 10.
max-complexity = 84

[tool.importlinter]
root_package = "dungdra"

[[tool.importlinter.contracts]]
name = "Engine layers (interfaces on top, rules kernel at the bottom)"
type = "layers"
containers = ["dungdra"]
layers = [
  "__main__",
  "cli",
  "play",
  "api : audit",
  "adventure",
  "gm : nl : fixtures : inventory_view",
  "turnhelp : creation : encounters : class_actions",
  "spells",
  "combat",
  "actions : traps : mounted : magic_items : rest : explore : hazards : gear : spellcasting",
  "character : monster",
  "creature : game : snapshot",
  "features : items : d20 : damage",
  "data",
  "rules : effects : events : geometry : dice : world",
]
# Baseline of today's layer violations. This list may only shrink; each entry is a refactor ticket.
ignore_imports = [
  "dungdra.combat -> dungdra.spells",
  "dungdra.creature -> dungdra.combat",
]
